async function open_(pw,e){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(e[0]),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(e[1])},k,d(e[2]));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){

  if(!silent)document.getElementById('e').textContent='Неверный пароль';
}
