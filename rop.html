async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},k,d(C));
  return new TextDecoder().decode(pt);
}
async function go(pw){
  try{const h=await open_(pw);try{sessionStorage.setItem('ffbpw',pw)}catch(e){}document.open();document.write(h);document.close();}
  catch(e){document.getElementById('e').textContent='Неверный пароль';}
}
